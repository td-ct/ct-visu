name: build

on:
  push:
    branches: [main, 'vibe/**']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:src
      - run: npm run test:flow
      - run: npm run build:single
      - run: cp dist/ct-visu.html ct-visu.html
      - run: npm run test:bundle
      - uses: actions/upload-artifact@v4
        with:
          name: ct-visu-single-html
          path: dist/ct-visu.html
          retention-days: 30
